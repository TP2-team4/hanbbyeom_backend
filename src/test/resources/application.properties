# 테스트에서는 주기 실행(@Scheduled) 스케줄링 자체를 끈다(global/config/SchedulingConfig).
#
# 스케줄러 스레드가 컨텍스트 시작 직후 서비스를 실행하는데, 서비스가 쓰는 Clock 빈을 목으로 바꾼 테스트에서는 스케줄러 스레드와
# 테스트 스레드가 같은 목을 동시에 호출해 스터빙이 ClassCastException으로 간헐적으로 깨질 수 있다(#94 이후). 또 캐시된 각 테스트
# 컨텍스트마다 스케줄러가 같은 DB를 주기적으로 건드려, 커밋된 픽스처를 쓰는 동시성 테스트와 간섭할 수 있다.
# 스케줄링을 통째로 끄므로 @Scheduled를 가진 클래스가 늘어나도 테스트에서는 전부 돌지 않는다. 스케줄러가 하는 일은 서비스 메서드를
# 직접 호출하는 테스트로 검증하므로 자동 실행에 의존하는 테스트는 없다. 운영 동작은 기본값(켜짐)이라 그대로다.
#
# 이 파일은 main의 application.yaml을 대체하지 않고 함께 로드되며, 같은 키는 이 파일이 우선한다.
app.scheduling.enabled=false
