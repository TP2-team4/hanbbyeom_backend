# 테스트 환경에서는 @Scheduled 메서드의 자동 실행을 비활성화한다.
# global/config/SchedulingConfig에서 app.scheduling.enabled=false일 때 스케줄링을 활성화하지 않는다.
#
# 스케줄링이 활성화되면 테스트 컨텍스트가 시작된 뒤 별도의 스케줄러 스레드가 서비스를 실행할 수 있다.
# 이때 테스트에서 Clock 빈을 Mockito Mock으로 교체한 경우,
# 스케줄러 스레드와 테스트 스레드가 같은 Mock을 동시에 사용하면서
# stubbing 충돌로 ClassCastException이 간헐적으로 발생한 이력이 있다(#94 이후).
#
# 또한 여러 테스트 컨텍스트의 스케줄러가 같은 테스트 DB를 주기적으로 수정하면
# 커밋된 픽스처를 사용하는 동시성 테스트와 간섭할 수 있다.
#
# 따라서 테스트에서는 스케줄링 전체를 비활성화한다.
# @Scheduled 메서드의 동작은 필요한 서비스 메서드를 테스트에서 직접 호출하여 검증한다.
# 운영 환경에서는 기본값이 활성화 상태이므로 실제 스케줄링 동작에는 영향을 주지 않는다.
#
# 이 파일은 main의 application.yaml과 함께 로드되며,
# 동일한 설정 키가 있는 경우 테스트 설정이 우선 적용된다.
app.scheduling.enabled=false

# 테스트 컨텍스트별 DB 커넥션 풀 크기를 줄인다 (#116).
#
# @SpringBootTest는 설정 조합(@AutoConfigureMockMvc, @MockitoBean, @TestBean, @Import 등)이 다르면
# 컨텍스트를 새로 띄우고 캐시에 그대로 둔다. 컨텍스트마다 Hikari 풀(기본 10개)이 생기므로
# 컨텍스트 7~9개면 연결이 70~90개까지 올라가고(측정 피크 76), Postgres 기본 max_connections=100에
# 다른 연결(DBeaver, 이전 테스트 JVM 잔여 등)이 겹치면 "최대 연결 개수를 초과했습니다"로 컨텍스트
# 로딩이 통째로 실패한다(#110 머지 후 로컬에서 21건 실패 재현).
#
# 동시성 테스트(MatchingConcurrentApplyTest, ActivityFeedbackConcurrentSubmitTest,
# ActivityCancelConcurrentTest, PasswordResetServiceTest)가 쓰는 스레드는 최대 2개라 4로 충분하다.
# 운영 설정(application.yaml)에는 영향 없음.
spring.datasource.hikari.maximum-pool-size=4
