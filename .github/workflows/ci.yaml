name: CI

# dev 또는 main에 반영되기 전후의 빌드·테스트 검증
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

# 소스 조회만 허용하는 CI 전용 최소 권한
permissions:
  contents: read

# PR과 dev는 이전 실행 취소, main은 실행 중인 이미지 발행 완료 보장
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    # 실제 PostgreSQL 환경을 사용하는 JPA·Flyway 검증용 임시 DB
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hanbbyeom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hanbbyeom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # GitHub Actions 안에서만 사용하는 테스트용 환경변수
    # 실행이 끝나면 임시 DB와 함께 폐기되는 공개 테스트 값
    env:
      DB_URL: jdbc:postgresql://localhost:5432/hanbbyeom_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_BASE64: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
      EMAIL_VERIFICATION_HMAC_SECRET_BASE64: jTUOvTn1QecT7ja6E4pKYex0lyldhw0gIgwFK8gKTGE=

    steps:
      # GitHub Actions 가상 환경으로 저장소 코드 복사
      - name: 저장소 코드 확인
        uses: actions/checkout@v6

      # 프로젝트 기준 Java 17 설치 및 Gradle 의존성 캐시 적용
      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # Linux 환경의 Gradle Wrapper 실행 권한 부여
      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x gradlew

      # 컴파일과 전체 테스트를 함께 수행하는 CI 핵심 단계
      - name: Gradle 빌드 및 테스트
        run: ./gradlew build --no-daemon

  publish-docker-image:
    name: Docker 이미지 발행
    needs: build-and-test
    runs-on: ubuntu-latest

    # PR과 dev Push 제외, main Push 전용 이미지 발행
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Dockerfile과 애플리케이션 소스가 포함된 main 커밋 확인
      - name: 저장소 코드 확인
        uses: actions/checkout@v6

      # GitHub Actions 캐시를 사용할 수 있는 Docker Buildx 환경 구성
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      # 계정 비밀번호 대신 Repository Secret에 등록된 Access Token 사용
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 추적 가능한 전체 커밋 해시 태그와 현재 배포용 latest 태그 동시 발행
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            shppark/hanbbyeom-backend:${{ github.sha }}
            shppark/hanbbyeom-backend:latest
          cache-from: type=gha,scope=hanbbyeom-backend
          cache-to: type=gha,mode=max,scope=hanbbyeom-backend
